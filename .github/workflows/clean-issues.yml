name: Clean New Issues

on:
  issues:
    types: [opened]

jobs:
  clean_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Remove assignees, labels, and milestone
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Remove all assignees
            if (context.payload.issue.assignees.length > 0) {
              await github.rest.issues.removeAssignees({
                owner,
                repo,
                issue_number,
                assignees: context.payload.issue.assignees.map(a => a.login)
              });
            }

            // Remove all labels
            if (context.payload.issue.labels.length > 0) {
              await github.rest.issues.removeAllLabels({
                owner,
                repo,
                issue_number
              });
            }

            // Remove milestone
            if (context.payload.issue.milestone) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                milestone: null
              });
            }
